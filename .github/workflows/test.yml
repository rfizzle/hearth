name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Full history so master exists for `buf breaking` in `make proto-check`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Install only, never run: `make ci` runs golangci-lint itself, so the
      # gate here is the one a developer runs locally.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `make fmt-check` refuses to run without goimports rather than skipping.
      - name: Install goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `make proto-check` and `make proto-drift` refuse to run without buf
      # rather than skipping.
      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ASTIMATE=true makes the astimate step a no-op here: the orchestrator
      # runs astimate locally until the binary is published.
      - name: make ci
        run: make ci ASTIMATE=true

      # Regenerates with buf's remote plugins and fails on drift. One generate
      # per run stays under the BSR's unauthenticated limit; BUF_TOKEN is
      # optional belt-and-braces and may be unset.
      - name: make proto-drift
        run: make proto-drift
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

      # Each package builds in its own .build; a cold run compiles
      # swift-protobuf more than once, so the builds are cached.
      - uses: actions/cache@v4
        with:
          path: |
            App/.build
            App/Packages/*/.build
          key: swift-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

      # `make swift-lint` refuses to run without swiftlint rather than skipping.
      - name: Install swiftlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: make ci-swift
        run: make ci-swift
