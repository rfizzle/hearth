syntax = "proto3";

package hearth.v1;

option go_package = "github.com/rfizzle/hearth/internal/rpc/gen/hearth/v1;hearthv1";

// ProviderService is sign-in: which providers have a credential, storing
// or clearing an API key, adding an OpenAI-compatible service under a name,
// and starting the ChatGPT browser sign-in. The core never returns a
// credential.
service ProviderService {
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {}
  rpc SetAPIKey(SetAPIKeyRequest) returns (SetAPIKeyResponse) {}
  rpc ClearCredential(ClearCredentialRequest) returns (ClearCredentialResponse) {}
  // StartChatGPTLogin returns the page the app opens in the browser and
  // keeps the sign-in going; the result arrives as an account_changed
  // event on EventService.Subscribe.
  rpc StartChatGPTLogin(StartChatGPTLoginRequest) returns (StartChatGPTLoginResponse) {}
  // ListKnownServices is the services hearth knows the address of, the
  // rows the app offers when the owner adds another service.
  rpc ListKnownServices(ListKnownServicesRequest) returns (ListKnownServicesResponse) {}
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_CHATGPT = 1;
  PROVIDER_ANTHROPIC = 2;
  PROVIDER_GEMINI = 3;
  PROVIDER_OPENROUTER = 4;
  PROVIDER_OPENAI_COMPATIBLE = 5;
}

enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_SIGNED_OUT = 1;
  ACCOUNT_STATE_SIGNING_IN = 2;
  ACCOUNT_STATE_SIGNED_IN = 3;
}

message ProviderAccount {
  Provider provider = 1;
  AccountState state = 2;
  // The signed-in email, or the last four characters of a key; never the
  // credential itself.
  string label = 3;
  // The failure of the last sign-in attempt, in plain words; empty otherwise.
  string failure = 4;
  // The fields below describe an OpenAI-compatible service the owner added,
  // and are empty for the built-in providers. profile is the stable id the
  // core minted when the service was added; one account per profile.
  string profile = 5;
  // The name the owner gave the service, shown on its card.
  string display_name = 6;
  // The address requests go to, ending before /chat/completions.
  string base_url = 7;
  // The model every quality tier asks this service for.
  string default_model = 8;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated ProviderAccount accounts = 1;
}

message SetAPIKeyRequest {
  Provider provider = 1;
  string key = 2;
  // The fields below are only for PROVIDER_OPENAI_COMPATIBLE and are empty
  // otherwise. An empty profile adds a service and the core mints its id;
  // a profile changes that service, and an empty key then keeps the stored
  // one.
  string base_url = 3;
  string profile = 4;
  string display_name = 5;
  string default_model = 6;
}

message SetAPIKeyResponse {
  ProviderAccount account = 1;
}

message ClearCredentialRequest {
  Provider provider = 1;
  // Which OpenAI-compatible service to remove; only for
  // PROVIDER_OPENAI_COMPATIBLE.
  string profile = 2;
}

message ClearCredentialResponse {}

message StartChatGPTLoginRequest {}

message StartChatGPTLoginResponse {
  string authorize_url = 1;
}

message ListKnownServicesRequest {}

message ListKnownServicesResponse {
  repeated KnownService services = 1;
}

enum KnownServiceKind {
  KNOWN_SERVICE_KIND_UNSPECIFIED = 0;
  // One of the four providers with a card of its own; id is its name.
  KNOWN_SERVICE_KIND_BUILTIN = 1;
  // An OpenAI-compatible service on the internet; it takes a key.
  KNOWN_SERVICE_KIND_COMPATIBLE = 2;
  // An OpenAI-compatible runtime on this Mac; it takes no key.
  KNOWN_SERVICE_KIND_LOCAL = 3;
}

// KnownService is a prefill for adding a service: everything but the key.
message KnownService {
  string id = 1;
  string name = 2;
  string base_url = 3;
  // Where the owner gets a key, or the runtime for a local one.
  string help_url = 4;
  // A model the service serves, offered as the default; empty for a
  // built-in, which has its own.
  string default_model = 5;
  KnownServiceKind kind = 6;
}
