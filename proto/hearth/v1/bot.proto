syntax = "proto3";

package hearth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rfizzle/hearth/internal/rpc/gen/hearth/v1;hearthv1";

// BotService creates and lists the org's bots and the role templates they
// start from, drafts a bot from a description, and lists and sets what a bot
// may do, edits a bot, and lists and changes what a bot remembers. Deletion
// arrives with a later milestone.
service BotService {
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse) {}
  rpc CreateBot(CreateBotRequest) returns (CreateBotResponse) {}
  rpc ListBots(ListBotsRequest) returns (ListBotsResponse) {}
  rpc GetBot(GetBotRequest) returns (GetBotResponse) {}
  // DraftBot asks the model to propose a bot from a description. It only
  // proposes: nothing is stored until the owner sends CreateBot.
  rpc DraftBot(DraftBotRequest) returns (DraftBotResponse) {}
  // ListGrants is what the bot may do, one row per capability and, for the
  // file capabilities, one row per folder.
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse) {}
  // SetGrants replaces the bot's grants whole. A capability left out is not
  // granted. The core refuses allowed mode for a capability that never has
  // standing permission, such as deleting files.
  rpc SetGrants(SetGrantsRequest) returns (SetGrantsResponse) {}
  // UpdateBot changes what the owner may edit: name, role, job description,
  // tier, avatar and the Advanced model override. Empty strings keep the
  // stored value; clear_model_override drops the override.
  rpc UpdateBot(UpdateBotRequest) returns (UpdateBotResponse) {}
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse) {}
  rpc EditNote(EditNoteRequest) returns (EditNoteResponse) {}
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse) {}
  rpc PinNote(PinNoteRequest) returns (PinNoteResponse) {}
}

// Capability is one thing a bot may do, as the Access sheet lists it.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_FILES_READ = 1;
  CAPABILITY_FILES_WRITE = 2;
  CAPABILITY_FILES_DELETE = 3;
  CAPABILITY_WEB_FETCH = 4;
  CAPABILITY_WEB_SEARCH = 5;
}

// GrantMode is whether a capability is off, asks each time, or is standing.
enum GrantMode {
  GRANT_MODE_UNSPECIFIED = 0;
  GRANT_MODE_NOT_GRANTED = 1;
  GRANT_MODE_ASK = 2;
  GRANT_MODE_ALLOWED = 3;
}

message Grant {
  Capability capability = 1;
  GrantMode mode = 2;
  // The folder for a files capability, absolute; empty otherwise.
  string folder = 3;
  // Plain words for the row, from the core: "Read files", "Delete files".
  string title = 4;
  // Whether allowed mode may be chosen; false where the owner must be asked
  // every time (see docs/architecture.md#5-security-model).
  bool can_allow = 5;
  // True for the bot's own folder, which the owner cannot remove.
  bool own_folder = 6;
}

message ListGrantsRequest {
  string bot_id = 1;
}

message ListGrantsResponse {
  repeated Grant grants = 1;
}

message SetGrantsRequest {
  string bot_id = 1;
  repeated Grant grants = 2;
}

message SetGrantsResponse {
  repeated Grant grants = 1;
}

// Tier is the quality tier the org maps to a provider and model.
enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_FAST = 1;
  TIER_BALANCED = 2;
  TIER_BEST = 3;
}

enum BotStatus {
  BOT_STATUS_UNSPECIFIED = 0;
  BOT_STATUS_IDLE = 1;
  BOT_STATUS_WORKING = 2;
  BOT_STATUS_PAUSED = 3;
  BOT_STATUS_DISABLED = 4;
}

message Bot {
  string id = 1;
  string name = 2;
  string role = 3;
  string job_description = 4;
  Tier tier = 5;
  BotStatus status = 6;
  // An SF Symbol name or an emoji; empty shows the name's initials.
  string avatar = 7;
  // The bot's own folder inside the Hearth folder, absolute.
  string folder_path = 8;
  // The bot's direct-message conversation, created with the bot.
  string dm_conversation_id = 9;
  // A model the owner pinned under Advanced; empty means the tier decides.
  string model_override = 10;
}

message RoleTemplate {
  string id = 1;
  string role = 2;
  // One line shown on the template card.
  string summary = 3;
  string job_description = 4;
  Tier suggested_tier = 5;
}

message ListTemplatesRequest {}

message ListTemplatesResponse {
  repeated RoleTemplate templates = 1;
}

message CreateBotRequest {
  string name = 1;
  string role = 2;
  string job_description = 3;
  Tier tier = 4;
  string avatar = 5;
}

message CreateBotResponse {
  Bot bot = 1;
}

message ListBotsRequest {}

message ListBotsResponse {
  repeated Bot bots = 1;
}

message GetBotRequest {
  string id = 1;
}

message GetBotResponse {
  Bot bot = 1;
}

message DraftBotRequest {
  // What the owner typed, in their own words.
  string description = 1;
  // The template the owner started from, if any; empty for a blank start.
  string template_id = 2;
  // The tier the owner has picked; the proposal may suggest another.
  Tier tier = 3;
}

message DraftBotResponse {
  string name = 1;
  string role = 2;
  // Plain sentences: what they do, how they work, what good looks like.
  string job_description = 3;
  // One line, such as "Direct and brief; leads with the answer".
  string working_style = 4;
  Tier tier = 5;
}

message UpdateBotRequest {
  string id = 1;
  string name = 2;
  string role = 3;
  string job_description = 4;
  Tier tier = 5;
  string avatar = 6;
  string model_override = 7;
  bool clear_model_override = 8;
}

message UpdateBotResponse {
  Bot bot = 1;
}

// Note is one thing a bot remembers, in plain words.
message Note {
  string id = 1;
  string bot_id = 2;
  string text = 3;
  bool pinned = 4;
  // The message the bot was reading when it remembered this.
  string conversation_id = 5;
  string message_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListNotesRequest {
  string bot_id = 1;
}

message ListNotesResponse {
  repeated Note notes = 1;
  // How many notes the bot may keep before it is asked to tidy them.
  int32 cap = 2;
}

message EditNoteRequest {
  string id = 1;
  string text = 2;
}

message EditNoteResponse {
  Note note = 1;
}

message DeleteNoteRequest {
  string id = 1;
}

message DeleteNoteResponse {}

message PinNoteRequest {
  string id = 1;
  bool pinned = 2;
}

message PinNoteResponse {
  Note note = 1;
}
