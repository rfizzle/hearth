version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: internal/rpc/gen
    opt: paths=source_relative
  # The BSR has no v1.21.1 plugin; v1.21.0 output runs on the v1.21.1 module.
  - remote: buf.build/connectrpc/go:v1.21.0
    out: internal/rpc/gen
    opt: paths=source_relative
  - remote: buf.build/apple/swift:v1.39.0
    out: App/Packages/HearthKit/Sources/HearthKit/Gen
    opt:
      - Visibility=Public
  - remote: buf.build/connectrpc/swift:v1.2.3
    out: App/Packages/HearthKit/Sources/HearthKit/Gen
    opt:
      - Visibility=Public
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
