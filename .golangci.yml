# The linter gate behind `make ci`. The default set (errcheck, govet,
# ineffassign, staticcheck, unused) with one carve-out: `defer f.Close()` and
# `defer tx.Rollback()` have no caller left to tell; `fmt.Fprint*` and
# `tabwriter.Flush` write to a buffer or the terminal, where a failed write is
# the terminal's problem; `fmt.Sscanf` on a config value leaves the zero, which
# is what an unparsable value means. Anything outside that list is still checked.
#
# errorlint on top of that: an error is compared with errors.Is, taken apart
# with errors.As and wrapped with %w, because a sentinel or a type that was
# wrapped on the way up is no longer == or a bare assertion.
#
# Two size gates on top. gocognit at 50 fails a function a reader can no
# longer hold in their head: well past the linter's default of 30, so a long
# but flat switch still lands. nestif at 10 fails an `if` whose nested
# branches score 10 or more, the depth where the reader loses which condition
# they are inside. Tests are out of both: a table walk reads top to bottom,
# and the gate is for product code.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocognit
    - nestif
  settings:
    gocognit:
      min-complexity: 50
    nestif:
      min-complexity: 10
  exclusions:
    rules:
      - linters: [errcheck]
        text: 'Error return value of `((.*\.)?(Close|Rollback|Flush)|fmt\.Fprint(f|ln)?|fmt\.Sscanf)` is not checked'
      # Tests read top to bottom; the size gates are for product code.
      - linters: [gocognit, nestif]
        path: _test\.go$
issues:
  # Every finding, every time: a cap on identical messages hides the rest
  # of a class behind three examples, and a gate that hides findings is
  # not a gate. For the same reason a second finding on a line is not
  # folded into the first: a complexity finding must not vanish behind
  # another linter's on the same function.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
